        var video = document.getElementById('video');
        var source = document.createElement('source');
        source.setAttribute('src', "http://www.tools4movies.com/trailers/1012/Despicable%20Me%202.mp4");
        video.innerHTML = '';
        video.appendChild(source);

        function handleQuery(searchQuery){
            var options = {
                shouldSort: true,
                minMatchCharLength: 2,
                keys: [
                    "text"
                ]
            };
            var fuse = new Fuse(formattedSubtitles, options); // "list" is the item array
            var result = fuse.search(searchQuery);
            if(result.length > 0){
                playVideo(result[0].start, result[0].episode)
            }
            else{
                alert("Kan ikke finde citat")
            }
        }

        function playVideo(start, episode){
            video.pause();
            source.setAttribute('src', videoUrls[episode-1]+"#t="+(start/1000-2));
            video.load();
            video.play();
        }

        fetch('matador.json')
            .then(response => response.json())
            .then(jsonResponse => {
                var subtitles = jsonResponse;
                for (var subtitle of subtitles) {
                    formattedSubtitles.push({
                        start: subtitle[0],
                        stop: subtitle[1],
                        text: subtitle[2],
                        episode: subtitle[3]
                    });
                }
            })
    </script>
